# Tunables for the LLM step. Code reads these; changing them needs no code change.

llm:
  # Hard monthly cap in USD (REQUIREMENTS §4 Phase 1).
  monthlyCapUsd: 20
  assess:
    model: claude-opus-5-5
    effort: low
    batchSize: 20
    maxTokens: 16000
  # USD per million tokens, by model id.
  prices:
    claude-opus-5-5: { input: 4.0, output: 20.0, cacheRead: 0.20, cacheWrite: 5.0 }
    claude-sonnet-5-5: { input: 2.0, output: 10.0, cacheRead: 0.20, cacheWrite: 2.5 }
    claude-haiku-5-5: { input: 0.10, output: 0.50, cacheRead: 0.01, cacheWrite: 0.125 }
